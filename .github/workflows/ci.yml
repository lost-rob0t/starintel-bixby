name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Python repository tests
        run: python -m unittest discover -s tests -v
      - name: Run JavaScript capsule tests
        run: node --test tests/js/*.test.mjs
      - name: Validate repository tree
        run: python tools/repo_policy.py .
